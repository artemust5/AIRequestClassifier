name: Docker Build Test

on:
  push:
    branches: [ "dev", "main", "feature/*" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t ai-classifier:latest .